name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  typecheck-and-build:
    name: 类型检查 + 构建
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 类型检查 (主进程)
        run: npm run typecheck:node

      - name: 类型检查 (渲染器)
        run: npm run typecheck:web

      - name: electron-vite 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ github.sha }}
          path: out/
          retention-days: 7
