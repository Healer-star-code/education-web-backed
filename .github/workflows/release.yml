name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v 前缀，例如 0.1.1）'
        required: true
        type: string

jobs:
  build-windows:
    name: 打包 Windows .exe
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 同步 package.json 版本号（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = '${{ inputs.version }}'
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding utf8

      - name: 类型检查
        run: npm run typecheck

      - name: electron-builder 打包 Windows
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 30

  build-linux:
    name: 打包 Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 同步 package.json 版本号（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        run: |
          node -e "const p=require('./package.json'); p.version='${{ inputs.version }}'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2))"

      - name: electron-builder 打包 Linux
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            release/*.AppImage
            release/latest-linux.yml
          retention-days: 30

  publish-release:
    name: 发布 GitHub Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - name: 下载 Linux 产物
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: release-assets

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 超级小金 ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
