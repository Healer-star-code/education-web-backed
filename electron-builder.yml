appId: com.educational-agent.desktop
productName: EducationalAgent
copyright: Copyright © 2025 EducationalAgent
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/node_modules/**/*"
  - "!**/{.git,.gitignore,.vscode,.idea}"
  - "!**/{*.map,*.ts,*.tsx}"
asar: true
asarUnpack:
  - resources/**

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 教育智能体
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

linux:
  target:
    - AppImage
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  # 自动更新源：发布版本时，把以下文件上传到这个 URL：
  #   - EducationalAgent-X.Y.Z-setup.exe
  #   - EducationalAgent-X.Y.Z-setup.exe.blockmap
  #   - latest.yml
  # 客户端启动后会去 ${url}/latest.yml 检查版本号。
  # 替换 example.com 为你自己的 HTTPS 静态服务器或对象存储 URL。
  - provider: generic
    url: https://example.com/educational-agent/updates
    channel: latest
