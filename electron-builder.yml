appId: com.educational-agent.desktop
productName: EducationalAgent
copyright: Copyright © 2025 EducationalAgent
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/node_modules/**/*"
  - "!**/{.git,.gitignore,.vscode,.idea}"
  - "!**/{*.map,*.ts,*.tsx}"
asar: true
asarUnpack:
  - resources/**

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 超级小金
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

linux:
  target:
    - AppImage
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  # 主要分发渠道：GitHub Releases（由 .github/workflows/release.yml 自动发布）
  # 当 push tag vX.Y.Z 时，Actions 会构建并把以下文件作为附件上传到 Release：
  #   - EducationalAgent-X.Y.Z-setup.exe       （Windows nsis 一键安装器）
  #   - EducationalAgent-X.Y.Z-setup.exe.blockmap （差分更新元数据）
  #   - EducationalAgent-X.Y.Z-portable.exe    （Windows 便携版）
  #   - EducationalAgent-X.Y.Z-x86_64.AppImage （Linux AppImage）
  #   - latest.yml / latest-linux.yml         （electron-updater 清单）
  - provider: github
    owner: Healer-star-code
    repo: education-web-backed
    releaseType: release

  # 备用分发：自建 HTTPS 静态服务器（如果不想用 GitHub Releases，把它放第一）
  # - provider: generic
  #   url: https://example.com/super-king-jin/updates
  #   channel: latest
