appId: com.super-king-agent.desktop
productName: super-king-agent
copyright: Copyright © 2025 super-king-agent
directories:
  output: release
  buildResources: build
files:
  # electron-builder 默认会自动包含 package.json 中 dependencies 声明的 node_modules，
  # 这里只补充 out/** 编译产物，并显式排除无关文件。
  # 切勿写 "!**/node_modules/**/*" —— 会把运行时依赖（tree-kill / electron-store /
  # electron-updater）一起干掉，启动报 ERR_MODULE_NOT_FOUND。
  - out/**/*
  - package.json
  - "!**/{.git,.gitignore,.vscode,.idea}"
  - "!**/{*.map,*.ts,*.tsx}"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme,test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
asar: true

# 把 resources/ 目录下的文件（如 tray 图标）复制到 app 包外的 resources/ 目录，
# 运行时可通过 process.resourcesPath 访问。dev 模式则用 app.getAppPath()/resources。
extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"

win:
  # 应用图标：build/icon.ico（6 分辨率：16/32/48/64/128/256）
  # 同时控制：.exe 内嵌图标、桌面快捷方式、开始菜单、任务栏、Alt+Tab、窗口标题栏
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 超级小金
  artifactName: ${productName}-${version}-setup.${ext}
  # 安装器本身也用同一张图标（如 NSIS 窗口标题栏）
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

portable:
  artifactName: ${productName}-${version}-portable.${ext}

linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  # 主要分发渠道：GitHub Releases（由 .github/workflows/release.yml 自动发布）
  # 当 push tag vX.Y.Z 时，Actions 会构建并把以下文件作为附件上传到 Release：
  #   - super-king-agent-X.Y.Z-setup.exe       （Windows nsis 一键安装器）
  #   - super-king-agent-X.Y.Z-setup.exe.blockmap （差分更新元数据）
  #   - super-king-agent-X.Y.Z-portable.exe    （Windows 便携版）
  #   - super-king-agent-X.Y.Z-x86_64.AppImage （Linux AppImage）
  #   - latest.yml / latest-linux.yml         （electron-updater 清单）
  - provider: github
    owner: Healer-star-code
    repo: education-web-backed
    releaseType: release

  # 备用分发：自建 HTTPS 静态服务器（如果不想用 GitHub Releases，把它放第一）
  # - provider: generic
  #   url: https://example.com/super-king-jin/updates
  #   channel: latest
